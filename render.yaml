
# Render Blueprint for the County Ward Tracker API and Hedera ledger sidecar.
# Keep this file at the repository root.

services:
  # Hedera ledger sidecar
  - type: web
    name: makueni-ledger-sidecar
    runtime: node
    plan: free
    region: oregon
    rootDir: ledger-sidecar
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: HEDERA_NETWORK
        value: testnet
      - key: HEDERA_OPERATOR_ID
        sync: false
      - key: HEDERA_OPERATOR_KEY
        sync: false
      - key: HEDERA_TOPIC_ID
        value: "0.0.10583604"

  # Flask backend
  - type: web
    name: county-ward-tracker-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn run:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --graceful-timeout 30
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PHONE_HASH_SALT
        sync: false
      - key: LEDGER_SIDECAR_URL
        sync: false
